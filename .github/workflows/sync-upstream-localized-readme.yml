          insert_after("[What The Diff](https://whatthediff.ai)", "[XFlux](https://www.xfluxapi.com)", "  * [XFlux](https://www.xfluxapi.com) - X/Twitter 只读 REST API（资料、搜索、时间线）及账户监控。免费层每月 1000 次 API 调用、1 个 monitor，并可即时获得 API key。HTTP webhooks 仅在付费计划提供，起价 $19/月。")

