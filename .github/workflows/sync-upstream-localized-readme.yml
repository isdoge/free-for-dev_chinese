          insert_after("[AlphaAI](https://alphai.io/developers)", "[AnyHook](https://anyhook.net)", "  * [AnyHook](https://anyhook.net) - 入站 webhook 中继：将 Stripe、GitHub 或 LINE Bot webhook 指向它，每个事件会先存储再投递到处理器，端点离线时会自动重试，并保留可重放的日志。无需账户即可通过 API 创建端点。免费计划每月 3000 个事件、1 个应用、3 次重试、保留 3 天，无需信用卡。")
          remove("[BrowserCat](https://www.browsercat.com)")
          insert_after("[Financial Data](https://financialdata.net/)", "[finlight](https://finlight.me)", "  * [finlight](https://finlight.me) - 实时金融新闻 API，支持实体解析（tickers、ISIN）和情绪标签，可通过 REST、WebSocket、webhooks 和 MCP server 使用。免费层 REST 与 MCP 每月各 5000 次请求，文章延迟 12 小时，无需信用卡。")
          insert_after("[Multi-Exit IP Address Checker](https://ip.alstra.ca/)", "[NASdisks Drive Data API](https://www.nasdisks.com/data/)", "  * [NASdisks Drive Data API](https://www.nasdisks.com/data/) - 面向 NAS HDD/SSD 规格的免费免密钥、支持 CORS 的 API，提供逐型号 CMR/SMR 分类，以及基于 Backblaze Drive Stats 的年化故障率。返回 JSON 或 CSV，采用 CC BY 4.0，无需注册。")
