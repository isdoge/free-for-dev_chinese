name: Sync upstream localized README

on:
  push:
    branches:
      - sync/upstream-2026-08-19
    paths:
      - .github/workflows/sync-upstream-localized-readme.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and localize README changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          EXPECTED_UPSTREAM="9bbbee10f82d78e6584172cf230a5e7f4f551194"
          git fetch https://github.com/ripienaar/free-for-dev.git master
          ACTUAL_UPSTREAM="$(git rev-parse FETCH_HEAD)"
          if [ "$ACTUAL_UPSTREAM" != "$EXPECTED_UPSTREAM" ]; then
            echo "Upstream advanced: expected $EXPECTED_UPSTREAM, got $ACTUAL_UPSTREAM" >&2
            exit 1
          fi

          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          MERGE_STATUS=$?
          set -e

          UNMERGED="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$UNMERGED" ] && [ "$UNMERGED" != "README.md" ]; then
            echo "Unexpected merge conflicts:" >&2
            echo "$UNMERGED" >&2
            exit 1
          fi

          # README is intentionally localized, so start from our current Chinese version
          # and apply only the upstream semantic changes below.
          git show HEAD:README.md > README.md

          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          lines = path.read_text(encoding="utf-8").splitlines()

          def find(marker):
              return [i for i, line in enumerate(lines) if marker in line]

          def require_one(marker):
              hits = find(marker)
              if len(hits) != 1:
                  raise RuntimeError(f"Expected exactly one match for {marker!r}, got {len(hits)}")
              return hits[0]

          def replace(marker, new_line):
              i = require_one(marker)
              lines[i] = new_line

          def remove(marker):
              i = require_one(marker)
              del lines[i]

          def insert_after(anchor, target, new_line):
              hits = find(target)
              if hits:
                  if len(hits) != 1:
                      raise RuntimeError(f"Expected at most one target match for {target!r}, got {len(hits)}")
                  lines[hits[0]] = new_line
                  return
              i = require_one(anchor)
              lines.insert(i + 1, new_line)

          def insert_before(anchor, target, new_line):
              hits = find(target)
              if hits:
                  if len(hits) != 1:
                      raise RuntimeError(f"Expected at most one target match for {target!r}, got {len(hits)}")
                  lines[hits[0]] = new_line
                  return
              i = require_one(anchor)
              lines.insert(i, new_line)

          # AWS free-tier updates.
          replace("[CloudFront](https://aws.amazon.com/cloudfront/)", "    * [CloudFront](https://aws.amazon.com/cloudfront/) - 每月 1TB 出站流量、1000 万次 HTTP 请求，以及每月 200 万次 Function 调用")
          replace("[CloudWatch](https://aws.amazon.com/cloudwatch/)", "    * [CloudWatch](https://aws.amazon.com/cloudwatch/) - 10 个自定义指标和告警、100 万次 API 请求、5GB 日志数据摄取和 5GB 日志数据归档")
          replace("[CodeBuild](https://aws.amazon.com/codebuild/)", "    * [CodeBuild](https://aws.amazon.com/codebuild/) - 每月 100 分钟构建时间")
          replace("[CodeCommit](https://aws.amazon.com/codecommit/)", "    * [CodeCommit](https://aws.amazon.com/codecommit/) - 5 个活跃用户、每个账户 5000 个仓库、每月 50GB 存储空间和 10000 次请求")
          replace("[CodePipeline](https://aws.amazon.com/codepipeline/)", "    * [CodePipeline](https://aws.amazon.com/codepipeline/) - 每月 1 条活跃流水线")
          replace("[Lambda](https://aws.amazon.com/lambda/)", "    * [Lambda](https://aws.amazon.com/lambda/) - 每月 100 万次请求")
          replace("[SNS](https://aws.amazon.com/sns/)", "    * [SNS](https://aws.amazon.com/sns/) - 每月 100 万次发布")
          replace("[SES](https://aws.amazon.com/ses/)", "    * [SES](https://aws.amazon.com/ses/) - 每月 3000 条消息（6 个月）")
          for marker in [
              "[EC2](https://aws.amazon.com/ec2/)",
              "[EBS](https://aws.amazon.com/ebs/)",
              "[Elastic Load Balancing](https://aws.amazon.com/elasticloadbalancing/)",
              "[RDS](https://aws.amazon.com/rds/)",
              "[S3](https://aws.amazon.com/s3/)",
              "[Glacier](https://aws.amazon.com/glacier/)",
          ]:
              remove(marker)

          # Azure free-tier updates.
          remove("[Virtual Machines](https://azure.microsoft.com/services/virtual-machines/)")
          replace("[Load Balancer](https://azure.microsoft.com/services/load-balancer/)", "    * [Load Balancer](https://azure.microsoft.com/services/load-balancer/) - 750 小时、15GB 数据处理量和 5 条规则（12 个月）")
          replace("[Bandwidth](https://azure.microsoft.com/pricing/details/bandwidth/)", "    * [Bandwidth](https://azure.microsoft.com/pricing/details/bandwidth/) - 15GB 出站流量（12 个月）")
          replace("[Storage](https://azure.microsoft.com/services/storage/)", "    * [Storage](https://azure.microsoft.com/services/storage/) - 100GB LRS 事务（Azure Files）、5GB Blob 存储、10GB LRS Archive Storage、2×64GB SSD（12 个月）")
          insert_after("[Event Grid](https://azure.microsoft.com/services/event-grid/)", "[Service Bus](https://azure.microsoft.com/products/service-bus/)", "    * [Service Bus](https://azure.microsoft.com/products/service-bus/) - Standard 层基础单元提供 750 小时和 1300 万次操作（12 个月）")

          # Cloud management solutions.
          insert_after("[deployment.io](https://deployment.io)", "[Parsivex](https://www.parsivex.com)", "  * [Parsivex](https://www.parsivex.com) - 扫描 AWS 账户中的闲置 EC2、未挂载 EBS、规格过大的 RDS、过期快照、NAT 网关过度使用等。免费层每月可扫描 1 个 AWS 账户，并返回每月浪费总额及分类明细；付费计划提供逐项结果和定时复扫。")

