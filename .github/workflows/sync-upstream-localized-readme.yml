          # Testing.
          insert_after("[seotest.me](https://seotest.me/)", "[Sherlo](https://sherlo.io)", "  * [Sherlo](https://sherlo.io) - React Native 应用的视觉回归测试。免费计划每月 1000 个 snapshots，支持 iOS 和 Android 模拟器。")

          # Security and PKI.
          insert_after("[CertObserver CT Search](https://certobserver.com/ct-search)", "[CertPost](https://www.certpost.ai)", "  * [CertPost](https://www.certpost.ai) - 实时 SSL/TLS 证书监控，支持 443 或自定义端口（SMTP/IMAP）。直接读取线上提供的证书，进行完整证书链验证，并在到期前通过 email 或 webhook 告警。免费层可永久免费监控 3 张证书。")
          insert_after("[Infisical](https://infisical.com/)", "[inspect.software](https://inspect.software/)", "  * [inspect.software](https://inspect.software/) - 自动化开源仓库审计的公开记录，涵盖安全状况、可维护性、依赖健康和恶意包检查，并提供版本化方法论与等级徽章。免费层可访问全部公开报告；达到公共关注阈值的仓库会自动覆盖（≥500 stars、≥50 forks，或组织仓库且 ≥250 stars）；支持嵌入徽章，并提供 100 个初始 credits（可用于 5 次低于阈值仓库的检查）。")

          # Monitoring.
          insert_after("[Accesserty Pulse](https://accesserty.com/en/pulse)", "[AlertKick](https://www.alertkick.com)", "  * [AlertKick](https://www.alertkick.com) - 将服务器安全（Linux eBPF agent）、可用性监控、on-call 告警和状态页集成在一个产品中。免费层包含 10 个 uptime monitors 和 heartbeats，5 分钟检查间隔、7 天数据保留。")
          # phare.io only fixed an English typo upstream; the existing Chinese description is already semantically current.

          # Email.
          insert_after("[Anypost](https://anypost.com)", "[Atomic Mail](https://atomicmail.ai)", "  * [Atomic Mail](https://atomicmail.ai) - 为 AI agents 设计的邮箱服务，完全免费。支持程序化创建 inbox、自定义域名，以及基于开放 JMAP 标准（RFC 8620/8621）的完整收发；提供托管 MCP server。它是真实邮箱服务，并非一次性或临时邮箱。")
          insert_after("[Buttondown](https://buttondown.email/)", "[Canny Pigeons](https://cannypigeons.com/)", "  * [Canny Pigeons](https://cannypigeons.com/) - DMARC 监控平台，支持 DNS 漂移告警、IP 威胁情报和无限用户。首个域名免费，无需信用卡。")
          insert_after("[Proton Mail](https://proton.me/mail)", "[Reloop](https://reloop.sh)", "  * [Reloop](https://reloop.sh) - 面向开发者的事务邮件 API 和 SMTP。免费计划每月 3000 封、每天 200 封，包含 1 个自定义域名和 1 个 agent inbox。")
          insert_after("[Wraps](https://wraps.dev)", "[ZeroSMTP](https://github.com/msgwing/ZeroSMTP)", "  * [ZeroSMTP](https://github.com/msgwing/ZeroSMTP) - 基于 msgwing.com 域名的免费 SMTP relay，每天最多 200 封，无付费层。只能从共享的 @msgwing.com 地址发送（不支持自定义域名）。提供 15 种语言的可运行代码示例，以及 Windows Server、Linux 和网络打印机配置指南。")
