          # Generative AI.
          insert_after("[Future AGI](https://futureagi.com)", "[Gonka Broker](https://gonkabroker.com/)", "  * [Gonka Broker](https://gonkabroker.com/) - 基于去中心化 Gonka.ai GPU 网络提供开源模型的 OpenAI-compatible API。每月提供 100 万+ 免费 tokens，可轻松集成多种 AI 工具。")
          remove("[Langtrace](https://langtrace.ai)")
          insert_after("[ReportGPT](https://ReportGPT.app)", "[telemetry.dev](https://telemetry.dev)", "  * [telemetry.dev](https://telemetry.dev) - 基于 OpenTelemetry 的 AI/LLM 应用可观测性服务。跟踪模型调用和工具步骤的 tokens、成本、延迟和错误；可从任意语言通过 HTTP 发送 OTLP，或使用 TypeScript SDKs。免费计划每月 10000 spans、保留 7 天、1 个项目和 2 个席位，无需信用卡。")
          # Arize AX only fixed an English typo upstream; the existing Chinese description is already semantically current.

          # PaaS.
          insert_after("[codenameone.com](https://www.codenameone.com/)", "[Cohesivity](https://cohesivity.ai)", "  * [Cohesivity](https://cohesivity.ai) - 为 AI agents 专门构建的 headless backend 和服务，包含托管、数据库、存储、LLMs 与第三方 APIs，并支持 agentic signup。免费层包含 10 个项目、100K edge requests、10GB 对象存储、100 封邮件，以及每月 $5 的 AI 和 search credits。")
          insert_after("[pythonanywhere.com](https://www.pythonanywhere.com/)", "[Runsite](https://runsite.app/)", "  * [Runsite](https://runsite.app/) - 欧洲 PaaS，可从 GitHub 自动部署 Web services 或静态站点（免费 1 个 Web 实例，0.1 vCPU/256MB），托管 PostgreSQL 和 Valkey(Redis) 可免费使用 30 天，事务邮件每月 3000 封免费，S3-compatible storage 5GB 免费。服务器位于德国。")

