name: Fix PR 4 URL preservation

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix-pr4-urls:
    if: github.event.pull_request.number == 4 && github.event.pull_request.head.ref == 'docs/zh-readme-layout-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/zh-readme-layout-v2
          fetch-depth: 0

      - name: Restore service URLs to master spelling
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "[pyup.io](https://pyup.io/)": "[pyup.io](https://pyup.io)",
              "[OnlineOrNot.com](https://onlineornot.com)": "[OnlineOrNot.com](https://onlineornot.com/)",
              "[exceptionless](https://exceptionless.com/)": "[exceptionless](https://exceptionless.com)",
              "[Hygger](https://hygger.io/)": "[Hygger](https://hygger.io)",
              "[Pulse.red](https://pulse.red/)": "[Pulse.red](https://pulse.red)",
              "[codiga.io](https://www.codiga.io)": "[codiga.io](https://codiga.io/)",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, got {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit URL-only correction and remove trigger
        run: |
          rm -f .github/pr4-url-fix-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/pr4-url-fix-trigger.txt
          git commit -m "docs: preserve upstream service URLs"
          git push origin HEAD:docs/zh-readme-layout-v2
